<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Miguel Antonio Vergara</title>
    <style>
        body {
            background-color: #5a2d0c;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
        }

        h2 {
            margin-top: 50px;
            font-size: 60px;
            font-weight: bold;
        }

        img {
            width: 700px;
            height: auto;
            margin-top: 20px;
            border-radius: 15px;
            border: 4px solid white;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            font-size: 25px;
            padding: 10px 20px;
            background: white;
            color: #5a2d0c;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }
        .btn {
            display: inline-block;
            background-color: white;
            color: #5a2d0c;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
            border: solid 4px;
        }

        .btn:hover {
            background-color: #5a2d0c;
            color: white;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h2>My Song</h2>
    <img src="Miguel_img/kleidescope.jpg">

    <a class="btn" href="https://www.youtube.com/watch?v=ClNTn1wtq7E" target="_blank">
        Click here to watch
    </a>

</body>
</html>
