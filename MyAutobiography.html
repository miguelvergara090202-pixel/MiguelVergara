<!DOCTYPE html>
<html>
<head>
    <title>Miguel Antonio Vergara</title>
    <style>
        body {
            background-color: #D5D1E9;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        p {
            font-size: 50px;
            color: black;
            font-weight: bold;
            margin-top: 20px;
        }

        img {
            width: 700px;
            height: 600px;
            border-radius: 15px;
            border: 4px solid black;
            cursor: pointer;
            transition: 0.3s ease;
        }

        img:hover {
            transform: scale(1.03);
            box-shadow: 0px 10px 25px rgba(0,0,0,0.3);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background-color: rgba(0,0,0,0.8);
            overflow: hidden;
        }

        .zoom-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 15px;
            transition: transform 0.1s ease-out;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            font-size: 50px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            z-index: 10000;
        }

        .close:hover {
            color: #bbbbbb;
        }
    </style>
</head>
<body>

    <p>My AutoBiography</p>

    <img id="myImage" src="Miguel_img/AutoBiography.jpg">

    <div id="imageModal" class="modal">
        <span class="close" id="closeBtn">&times;</span>
        <div class="zoom-container" id="zoomArea">
            <img class="modal-content" id="modalImg">
        </div>
    </div>

    <script>
        let modal = document.getElementById("imageModal");
        let img = document.getElementById("myImage");
        let modalImg = document.getElementById("modalImg");
        let closeBtn = document.getElementById("closeBtn");
        let zoomArea = document.getElementById("zoomArea");

        let scale = 1;

        img.onclick = function () {
            modal.style.display = "block";
            modalImg.src = this.src;
            scale = 1;
            modalImg.style.transform = "scale(1)";
        };
        closeBtn.onclick = function () {
            modal.style.display = "none";
        };

        modal.addEventListener("click", function (event) {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        });
        modalImg.addEventListener("wheel", function (event) {
            event.preventDefault();

            if (event.deltaY < 0) {
                scale += 0.1;
            } else {
                scale -= 0.1;
                if (scale < 1) scale = 1;
            }

            modalImg.style.transform = `scale(${scale})`;
        });
    </script>

</body>
</html>
